spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: restaurant-voice-platform
  datasource:
    url: ${VOICE_DB_URL}
    username: ${VOICE_DB_USER}
    password: ${VOICE_DB_PASSWORD}
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
