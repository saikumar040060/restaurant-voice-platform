<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarborVoice Operations</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <script defer src="/dashboard/dashboard.js"></script>
</head>
<body>
  <main>
    <header><h1>HarborVoice Operations</h1><p id="identity">Sign in to view your tenant.</p></header>
    <section id="login-panel" aria-labelledby="login-heading">
      <h2 id="login-heading">Sign in</h2>
      <form id="login-form">
        <label>Username <input id="username" autocomplete="username" maxlength="120" required></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" maxlength="72" required></label>
        <button type="submit">Sign in</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <nav aria-label="Dashboard actions">
        <button data-view="menu">Menu</button><button data-view="orders">Orders</button>
        <button data-view="review">Menu review</button><button data-view="operations">Operations</button><button data-view="transfers">Transfers</button><button id="logout">Sign out</button>
      </nav>
      <p id="status" role="status"></p>
      <section id="content" aria-live="polite"></section>
    </section>
  </main>
</body>
</html>
